<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | L'ARTISTA Restaurant</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1F3D2B;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .logo {
            font-size: 3em;
            margin-bottom: 20px;
        }
        .contact-info {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">🍝</div>
        <h1>You're Offline</h1>
        <p>It looks like you've lost your internet connection. Some features may be unavailable.</p>
        <p>You can still view cached content, but for the full experience please reconnect.</p>
        
        <div class="contact-info">
            <p><strong>L'ARTISTA Italian Restaurant</strong></p>
            <p>Vaļņu iela 25, Riga</p>
            <p>Phone: +371 25455947</p>
        </div>
        
        <button onclick="window.location.reload()" style="padding: 12px 24px; background: #D6273B; color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 20px;">
            Try Again
        </button>
    </div>
</body>
</html>
