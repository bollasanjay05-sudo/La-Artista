<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>L'artista Riga | Italian Restaurant</title>
<meta name="description" content="Best Italian restaurant in Riga – L'artista. Authentic pasta, pizza & fine Italian wine. Book via Table Agent.">
<meta name="robots" content="index, follow">

<!-- Preload Hero Image (LCP Fix) -->
<link rel="preload" as="image" href="LARTISTA AMBIANCE/R6II7575.jpg" fetchpriority="high">

<!-- Fonts optimized -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

<style>
html { scroll-behavior:smooth; }
body{margin:0;font-family:Inter,sans-serif;background:#faf7f2;color:#1A1A1A}
img{max-width:100%;height:auto}
.container{max-width:1200px;margin:auto;padding:0 20px}
.hero{position:relative;min-height:90vh;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:brightness(.6)}
.hero-content{position:relative;z-index:2}
.btn{display:inline-block;padding:14px 32px;border-radius:50px;text-decoration:none;font-weight:600}
.btn-red{background:#D6273B;color:#fff}
.section{padding:60px 0}
.menu-item{display:flex;gap:16px;margin-bottom:20px}
.dish-photo{width:100px;height:100px;border-radius:16px;object-fit:cover}
</style>

</head>
<body>

<!-- HERO -->
<section class="hero" id="home">
<img src="LARTISTA AMBIANCE/R6II7575.jpg"
     alt="L'artista restaurant interior Riga"
     width="1920"
     height="1080"
     fetchpriority="high">

<div class="hero-content container">
<h1>Italian Restaurant in Riga</h1>
<p>Authentic pasta, pizza & fine Italian wine</p>
<a href="#reservation" class="btn btn-red">Book a Table</a>
<a href="#menu" class="btn">View Menu</a>
</div>
</section>

<!-- MENU SAMPLE -->
<section class="section container" id="menu">
<h2>Our Menu</h2>

<div class="menu-item">
<img src="LARTISTA DISHES/CAESAR SALAD.jpg"
     alt="Caesar salad with parmesan and toast"
     class="dish-photo"
     width="400"
     height="400"
     loading="lazy"
     decoding="async">
<div>
<h3>Caesar Salad – €12</h3>
<p>Parmesan cheese, toast</p>
</div>
</div>

<div class="menu-item">
<img src="LARTISTA DISHES/TRUFFLE RISOTTO.jpg"
     alt="Truffle risotto with black truffles"
     class="dish-photo"
     width="400"
     height="400"
     loading="lazy"
     decoding="async">
<div>
<h3>Truffle Risotto – €25</h3>
<p>Fresh black truffles</p>
</div>
</div>

</section>

<!-- RESERVATION -->
<section class="section container" id="reservation">
<h2>Reserve Your Table</h2>

<iframe src="https://tableagent.com/iframe/lartista-riga/v/medium/"
        title="Table booking form"
        loading="lazy"
        width="100%"
        height="700"
        style="border:0;">
</iframe>

</section>

<script defer>
document.addEventListener("DOMContentLoaded",function(){
document.querySelectorAll('a[href^="#"]').forEach(a=>{
a.addEventListener('click',function(e){
e.preventDefault();
document.querySelector(this.getAttribute("href")).scrollIntoView({behavior:"smooth"});
});
});
});
</script>

</body>
</html>
